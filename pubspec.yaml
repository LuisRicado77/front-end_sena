name: app_sena
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 300
        - asset: assets/fonts/Poppins-BlackItalic.ttf
          style: italic

  assets:
    - assets/images/alquilartransparente.png
    - assets/images/comprartrasparente.png
    - assets/icons/login.png
    - assets/icons/user.png
    - assets/icons/filter.png
    - assets/icons/window.png
    - assets/icons/lupa.png
    - assets/images/logo.jpeg
    - assets/images/housewithman.png
    - assets/images/ref.jpeg
    - assets/images/terreno.jpeg
    - assets/images/todotrasparente.png
    - assets/images/muebles.jpeg
    - assets/images/seacherwithhouse.png
    - assets/images/casa1.jpg
